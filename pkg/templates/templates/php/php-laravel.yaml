# Template: php-laravel
# Pack: php
# Description: PHP Laravel application
# Tags: php, laravel
---
schema_version: "1"

project:
  name: {{ .ProjectName }}
  version: {{ .Version }}

build:
  pack: php
  template: php-laravel
  command: "composer install --no-dev --optimize-autoloader --ignore-platform-reqs"
  env:
    COMPOSER_CACHE_DIR: /tmp/composer-cache
  dependencies:
  - php-8.4
  - composer
  - build-base
  - php-8.4-openssl
  - php-8.4-mbstring
  - php-8.4-xml
  - php-8.4-dom
  - php-8.4-curl
  - php-8.4-ctype
  - php-8.4-fileinfo
  - php-8.4-intl
  - php-8.4-zip
  - php-8.4-bcmath
  - php-8.4-gd
  - php-8.4-pdo
  - php-8.4-pdo_mysql
  - php-8.4-mysqlnd
  - php-8.4-pdo_sqlite
  - php-8.4-pdo_pgsql

image:
  entrypoint: php
  cmd: [ "-S", "0.0.0.0:8000", "-t", "/app/public" ]
  packages:
  - ca-certificates-bundle
  - php-8.4
  - php-8.4-openssl
  - php-8.4-mbstring
  - php-8.4-xml
  - php-8.4-dom
  - php-8.4-curl
  - php-8.4-ctype
  - php-8.4-fileinfo
  - php-8.4-intl
  - php-8.4-zip
  - php-8.4-bcmath
  - php-8.4-gd
  - php-8.4-pdo
  - php-8.4-pdo_mysql
  - php-8.4-mysqlnd
  - php-8.4-pdo_sqlite
  - php-8.4-pdo_pgsql
  ports:
  - "8000"
  env:
    # No APP_KEY here — the php pack generates one fresh at build time and
    # writes it into the image's .env, so no secret is ever committed.
    APP_ENV: production
    APP_DEBUG: "false"
    DB_CONNECTION: sqlite
    LOG_CHANNEL: stderr
    # Avoids Laravel's "database" defaults for session/cache/queue, which
    # need tables this build never migrates.
    CACHE_STORE: file
    SESSION_DRIVER: file
    QUEUE_CONNECTION: sync
  run_as: 65532

update:
  auto_check: true
