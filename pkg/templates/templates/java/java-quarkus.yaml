# Template: java-quarkus
# Pack: java
# Description: Quarkus 3 application (Maven, uber-jar)
# Tags: java, maven, quarkus
---
schema_version: "1"

project:
  name: {{ .ProjectName }}
  version: {{ .Version }}

build:
  pack: java
  template: java-quarkus
  command: "mvn package -DskipTests"
  dependencies:
    - openjdk-21
    - maven
    - build-base
  env:
    JAR_DIR: target

image:
  entrypoint: /usr/lib/jvm/java-21-openjdk/bin/java
  cmd: ["-jar", "/app/app-runner.jar"]
  packages:
    - openjdk-21-jre
    - ca-certificates-bundle
  env:
    JAVA_HOME: /usr/lib/jvm/java-21-openjdk
    JAVA_OPTS: "-XX:+UseContainerSupport -XX:MaxRAMPercentage=75.0"
  run_as: 65532
  ports:
    - "8080"

update:
  auto_check: true
