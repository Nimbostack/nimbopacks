# Template: web-hugo
# Pack: web
# Description: Hugo static site served by nginx
# Tags: web, hugo, ssg, nginx
---
schema_version: "1"

project:
  name: {{ .ProjectName }}
  version: {{ .Version }}

build:
  pack: web
  template: web-hugo
  command: "hugo --minify"
  dependencies:
    - hugo
    - build-base
  env:
    OUTPUT_DIR: public

image:
  entrypoint: /usr/sbin/nginx
  cmd: ["-e", "/dev/stderr", "-c", "/etc/nginx/nimbopacks.conf"]
  packages:
    - nginx
    - ca-certificates-bundle
  run_as: 65532
  ports:
    - "8080"

update:
  auto_check: true
