# Template: node-nestjs
# Pack: node
# Description: NestJS application compiled with tsc
# Tags: web, api, rest, typescript
---
schema_version: "1"

project:
  name: {{ .ProjectName }}
  version: {{ .Version }}

build:
  pack: node
  template: node-nestjs
  command: "npm install && npm run build"

image:
  entrypoint: node
  cmd: ["/app/dist/main.js"]
  packages:
    - nodejs-20
    - ca-certificates-bundle
  env:
    NODE_ENV: production
    PORT: "8080"
  run_as: 65532
  ports:
    - "8080"

update:
  auto_check: true
