# Template: dotnet-worker
# Pack: dotnet
# Description: .NET Worker Service (background service, no HTTP port)
# Tags: worker, background, service
---
schema_version: "1"

project:
  name: {{ .ProjectName }}
  version: {{ .Version }}

build:
  pack: dotnet
  template: dotnet-worker
  command: "dotnet publish -c Release -o /home/build/output/app --no-self-contained"
  dependencies:
    - dotnet-8-sdk
    - build-base

image:
  entrypoint: dotnet
  cmd: ["/app/{{ .ProjectName }}.dll"]
  packages:
    - dotnet-8-runtime
    - ca-certificates-bundle
    - icu-libs
  env:
    DOTNET_SYSTEM_GLOBALIZATION_INVARIANT: "false"
  run_as: 65532

update:
  auto_check: true
