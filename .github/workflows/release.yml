name: Release

on:
  push:
    tags:
      - 'v*.*.*'

# Minimal read-only default; jobs elevate only what they need.
permissions:
  contents: read

jobs:
  goreleaser:
    name: GoReleaser
    runs-on: ubuntu-latest
    # Create the GitHub Release and upload artifacts.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: '1.24'
          cache: true

      - uses: anchore/sbom-action/download-syft@e22c389904149dbc22b58101806040fa8d37a610 # v0

      - uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          distribution: goreleaser
          version: latest
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  oci-image:
    name: OCI Image
    needs: goreleaser
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0

      # Generate an ephemeral signing key for this build only.
      # The key is never stored — the final image is verified via keyless cosign.
      - name: Setup melange
        uses: chainguard-dev/actions/setup-melange@de68b87302e6266db5fb5220246f8aa46fe94b67 # main

      - name: Generate ephemeral signing key
        run: melange keygen melange.rsa

      # Build the nimbopacks APK for both architectures.
      # package-version-tag strips the 'v' prefix (v0.1.0 → 0.1.0).
      - name: Build APK with melange
        uses: chainguard-dev/actions/melange-build-pkg@de68b87302e6266db5fb5220246f8aa46fe94b67 # main
        with:
          config: melange.yaml
          signing-key-path: ${{ github.workspace }}/melange.rsa
          repository-path: ${{ github.workspace }}/packages
          archs: x86_64,aarch64
          source-dir: ${{ github.workspace }}
          package-version-tag: ${{ github.ref_name }}

      - name: Sign APKINDEX
        run: |
          for arch in x86_64 aarch64; do
            melange sign-index \
              --signing-key "${{ github.workspace }}/melange.rsa" \
              "${{ github.workspace }}/packages/${arch}/APKINDEX.tar.gz"
          done

      # Assemble the OCI image with apko, push to GHCR, and sign keylessly.
      # Runs inside wolfi-act so apko/cosign/crane are available without
      # installing them on the runner.
      - name: Build, push, and sign OCI image
        uses: wolfi-dev/wolfi-act@d78f3659c50c4520e222df428f4903a1c4b0c6ee # main
        env:
          IMAGE_TAG: ${{ github.ref_name }}
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Pass OIDC vars so cosign keyless signing works inside the container.
          ACTIONS_ID_TOKEN_REQUEST_URL: ${{ env.ACTIONS_ID_TOKEN_REQUEST_URL }}
          ACTIONS_ID_TOKEN_REQUEST_TOKEN: ${{ env.ACTIONS_ID_TOKEN_REQUEST_TOKEN }}
        with:
          packages: apko,cosign,crane
          command: |
            set -ex

            echo "${GITHUB_TOKEN}" | apko login ghcr.io -u "${GITHUB_ACTOR}" --password-stdin

            # Build and push multi-arch image + SBOM.
            # --repository-append adds the locally built nimbopacks APK.
            # --keyring-append trusts the ephemeral key used to sign it.
            # apko does not create --sbom-path itself; it renames the generated
            # SBOMs into it, so the directory must exist beforehand.
            mkdir -p sbom
            apko publish apko.yaml \
              "ghcr.io/nimbostack/nimbopacks:${IMAGE_TAG}" \
              "ghcr.io/nimbostack/nimbopacks:latest" \
              --keyring-append melange.rsa.pub \
              --repository-append packages \
              --arch x86_64,aarch64 \
              --sbom-path sbom

            # Sign both tags against the resolved image digest (keyless).
            DIGEST=$(crane digest "ghcr.io/nimbostack/nimbopacks:${IMAGE_TAG}")
            cosign sign --yes "ghcr.io/nimbostack/nimbopacks:${IMAGE_TAG}@${DIGEST}"
            cosign sign --yes "ghcr.io/nimbostack/nimbopacks:latest@${DIGEST}"
