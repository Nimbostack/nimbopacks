name: Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      push:
        description: 'Push the image to GHCR (uncheck to build-only)'
        type: boolean
        default: false
      tag:
        description: 'Tag to build the image for (defaults to latest commit on this branch)'
        type: string
        default: ''

# Minimal read-only default; jobs elevate only what they need.
permissions:
  contents: read

jobs:
  goreleaser:
    name: GoReleaser
    # Tag pushes only. workflow_dispatch is for dry-running the OCI Image job
    # against a branch without cutting a GitHub Release.
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    # Create the GitHub Release and upload artifacts.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: '1.26.11'
          # No module cache here: this job signs and publishes the release,
          # so it always builds from a clean module download rather than a
          # cache that an earlier, differently-triggered run could have
          # populated.
          cache: false

      - uses: anchore/sbom-action/download-syft@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2

      - uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          distribution: goreleaser
          version: latest
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  oci-image:
    name: OCI Image
    needs: goreleaser
    # goreleaser is skipped on workflow_dispatch (no tag cut); run anyway in
    # that case so this job can dry-build/verify the image from a branch.
    if: always() && (needs.goreleaser.result == 'success' || needs.goreleaser.result == 'skipped')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write

    env:
      MELANGE_VERSION: '0.64.1'
      APKO_VERSION: '1.5.0'
      # On a real tag push this is the tag (e.g. v0.2.2). On workflow_dispatch
      # it's an operator-supplied value, defaulting to a run-scoped test tag
      # so manual verification runs never collide with or resemble a release.
      IMAGE_TAG: ${{ github.event_name == 'push' && github.ref_name || (inputs.tag != '' && inputs.tag || format('ci-test-{0}', github.run_id)) }}
      DO_PUSH: ${{ github.event_name == 'push' || inputs.push == true }}

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0

      # melange's default runner (bubblewrap) needs unprivileged user
      # namespaces, which Ubuntu 24.04 restricts under AppArmor by default.
      # This sysctl is the documented workaround and needs no service restart
      # (unlike chainguard-dev/actions/setup-melange, which tries to restart
      # apparmor.service and fails on hosted runners). Proven in samples.yml.
      - name: Enable rootless bubblewrap
        run: |
          sudo apt-get update
          sudo apt-get install -y bubblewrap
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

      # Registers qemu binfmt handlers so melange's bubblewrap runner can
      # emulate aarch64 on this x86_64 runner. Replaces the
      # `apt-get install qemu-user-static` chainguard-dev/actions/setup-melange
      # did — that package was renamed qemu-user-binfmt on Ubuntu 24.04, which
      # broke the job on ubuntu-latest. This action doesn't depend on distro
      # package naming.
      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - name: Install melange and apko
        run: |
          set -euo pipefail
          curl -fsSL -o melange.tar.gz \
            "https://github.com/chainguard-dev/melange/releases/download/v${MELANGE_VERSION}/melange_${MELANGE_VERSION}_linux_amd64.tar.gz"
          tar -xzf melange.tar.gz "melange_${MELANGE_VERSION}_linux_amd64/melange"
          sudo install -m 0755 "melange_${MELANGE_VERSION}_linux_amd64/melange" /usr/local/bin/melange

          curl -fsSL -o apko.tar.gz \
            "https://github.com/chainguard-dev/apko/releases/download/v${APKO_VERSION}/apko_${APKO_VERSION}_linux_amd64.tar.gz"
          tar -xzf apko.tar.gz "apko_${APKO_VERSION}_linux_amd64/apko"
          sudo install -m 0755 "apko_${APKO_VERSION}_linux_amd64/apko" /usr/local/bin/apko

          rm -rf melange.tar.gz apko.tar.gz "melange_${MELANGE_VERSION}_linux_amd64" "apko_${APKO_VERSION}_linux_amd64"

      - uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3

      # Generate an ephemeral signing key for this build only.
      # The key is never stored — the final image is verified via keyless cosign.
      - name: Generate ephemeral signing key
        run: melange keygen melange.rsa

      # melange has no flag to override package.version, so patch the one
      # line in melange.yaml instead. Tags are v-prefixed (v0.2.2); apk
      # versions are not, so strip it. workflow_dispatch builds may run
      # against a non-tag ref, so fall back to a local pseudo-version.
      - name: Set package version
        run: |
          set -euo pipefail
          if [[ "${IMAGE_TAG}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            version="${IMAGE_TAG#v}"
          else
            version="0.0.0+${GITHUB_SHA:0:7}"
          fi
          sed -i "s/^  version: .*/  version: ${version}/" melange.yaml

      # Build the nimbopacks APK for both architectures.
      - name: Build APK with melange
        run: |
          melange build melange.yaml \
            --signing-key melange.rsa \
            --out-dir packages \
            --arch x86_64,aarch64 \
            --source-dir "${GITHUB_WORKSPACE}"

      - name: Sign APKINDEX
        run: |
          for arch in x86_64 aarch64; do
            melange sign-index \
              --signing-key melange.rsa \
              "packages/${arch}/APKINDEX.tar.gz"
          done

      - name: Log in to GHCR
        if: env.DO_PUSH == 'true'
        run: echo "${{ secrets.GITHUB_TOKEN }}" | apko login ghcr.io -u "${{ github.actor }}" --password-stdin

      # --repository-append adds the locally built nimbopacks APK.
      # --keyring-append trusts the ephemeral key used to sign it.
      # apko does not create --sbom-path itself; it renames the generated
      # SBOMs into it, so the directory must exist beforehand.
      # `latest` only moves on a real tag push — a workflow_dispatch run with
      # push enabled still only touches its own (test) tag.
      - name: Build and push OCI image
        if: env.DO_PUSH == 'true'
        run: |
          mkdir -p sbom
          tags=("ghcr.io/nimbostack/nimbopacks:${IMAGE_TAG}")
          if [[ "${GITHUB_EVENT_NAME}" == "push" ]]; then
            tags+=("ghcr.io/nimbostack/nimbopacks:latest")
          fi
          apko publish apko.yaml \
            "${tags[@]}" \
            --keyring-append melange.rsa.pub \
            --repository-append packages \
            --arch x86_64,aarch64 \
            --sbom-path sbom \
            --image-refs image-refs.txt

      # Build-only dry run (workflow_dispatch with push unchecked): proves the
      # melange + apko pipeline is green without touching the registry.
      - name: Build OCI image (no push)
        if: env.DO_PUSH != 'true'
        run: |
          mkdir -p sbom
          apko publish apko.yaml \
            "ghcr.io/nimbostack/nimbopacks:${IMAGE_TAG}" \
            --local \
            --keyring-append melange.rsa.pub \
            --repository-append packages \
            --arch x86_64,aarch64 \
            --sbom-path sbom

      # Sign every pushed tag against its resolved image digest (keyless).
      - name: Sign OCI image
        if: env.DO_PUSH == 'true'
        run: |
          while read -r ref; do
            cosign sign --yes "${ref}"
          done < image-refs.txt
