name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      # AUDIT MODE ONLY. This logs outbound network calls (to the job summary
      # and, if a free StepSecurity account is linked, to their dashboard) but
      # blocks nothing. See the PR description for why: there is no egress
      # baseline for this repo yet, and flipping straight to `egress-policy:
      # block` without one risks breaking every PR the moment a tool resolves
      # an unlisted host.
      - uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: audit
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache: false
      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.11.4

  test:
    name: Test (${{ matrix.os }})
    needs: lint
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      # audit-mode only; see the comment in the lint job above.
      - uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: audit
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache: true
      - name: Run tests
        run: go test -race ./...

  build:
    name: Build
    needs: lint
    runs-on: ubuntu-latest
    steps:
      # audit-mode only; see the comment in the lint job above.
      - uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: audit
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache: true
      - name: Build binary
        run: go build ./...

  # Secret scan over the full commit history, not just the diff. A secret
  # removed in a later commit is still published the moment the repo is
  # public, so the working tree being clean proves nothing.
  #
  # BLOCKING. gitleaks v8.30.1 reports no findings across all 23 commits on
  # every ref as of 2026-10-23, so this starts green with no baseline file and
  # no allowlist -- there is no suppression debt to inherit and nothing to
  # grandfather in.
  secrets:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          # Full history: `gitleaks git` walks commits, and a shallow clone
          # would silently scan almost nothing and still pass.
          fetch-depth: 0
          # The scan needs no credentials; don't leave a token in .git/config
          # for it to run alongside.
          persist-credentials: false

      # Installed from the pinned release tarball rather than via
      # gitleaks/gitleaks-action, which requires a GITLEAKS_LICENSE secret for
      # organization-owned repositories. Verifying the published SHA-256 is
      # also a stronger integrity check than trusting a tag.
      - name: Install gitleaks
        env:
          GITLEAKS_VERSION: 8.30.1
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          set -euo pipefail
          curl -sSfL -o gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gitleaks.tar.gz" | sha256sum -c -
          tar -xzf gitleaks.tar.gz gitleaks
          ./gitleaks version

      # --redact is not cosmetic: without it gitleaks prints the matched
      # secret, which would publish a real leak into the CI log the moment it
      # detects one. --log-opts=--all covers every ref, including the PR head.
      - name: Scan commit history
        run: ./gitleaks git --no-banner --redact --exit-code 1 --log-opts="--all" .

  # Known-vulnerability scan. govulncheck is reachability-based: it reports a
  # vulnerability only when a symbol on an actually-callable path is affected,
  # so its findings are not advisory noise -- each one is a code path we ship.
  #
  # REPORT-ONLY (continue-on-error) until the Go toolchain bump lands.
  # As of 2026-10-23 this job reports 25 reachable vulnerabilities, all of them
  # in the Go standard library, because the repo builds on Go 1.24 -- a release
  # line that no longer receives security backports (the fixes are in go1.25.8
  # through go1.26.10). Zero reachable vulnerabilities come from our own
  # dependencies. Making the job blocking today would wall off every PR for a
  # reason no PR author can fix.
  #
  # Flip `continue-on-error` to false in the same change that bumps go-version
  # past 1.26.10. Leaving this report-only indefinitely is the failure mode to
  # watch for; it is tracked, not forgotten.
  vuln:
    name: Vulnerabilities (govulncheck)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: '1.24'
          cache: true
      # Pinned, not @latest: govulncheck v1.9+ requires Go 1.26 to build, and
      # @latest would let the scanner drift independently of what we review.
      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@v1.1.4
      # GOTOOLCHAIN=local forces the scan to use the same Go that the build and
      # release jobs use. Without it a `toolchain` directive in go.mod could
      # silently pull a newer Go here, clearing the stdlib findings in the
      # report while the shipped binary stays vulnerable.
      - name: Run govulncheck
        env:
          GOTOOLCHAIN: local
        run: govulncheck ./...

