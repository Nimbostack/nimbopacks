name: Samples

on:
  pull_request:
    paths:
      - 'samples/**'
      - 'pkg/packs/**'
      - 'pkg/templates/**'
      - 'pkg/backend/**'
      - 'internal/**'
      - 'cmd/**'
      - '.github/workflows/samples.yml'
  workflow_dispatch:
  schedule:
    - cron: '0 6 * * 1' # Mondays 06:00 UTC

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  changes:
    name: Determine affected samples
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.compute.outputs.matrix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
        with:
          fetch-depth: 0
      - name: Compute affected samples
        id: compute
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            matrix="$(git diff --name-only "$BASE_SHA" "$HEAD_SHA" | ./samples/affected-samples.sh)"
          else
            # workflow_dispatch / schedule: always verify everything, to
            # catch drift in the rolling Wolfi package set.
            matrix="$(./samples/affected-samples.sh </dev/null)"
          fi
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"
          echo "Affected samples: $matrix"

  verify:
    name: ${{ matrix.sample }}
    needs: changes
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        sample: ${{ fromJSON(needs.changes.outputs.matrix) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache: true
      - name: Enable rootless melange (bubblewrap)
        run: |
          sudo apt-get update
          sudo apt-get install -y bubblewrap
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - name: Build nimbopacks
        run: go build -o bin/nimbopacks ./cmd/nimbopacks
      - name: Install toolchain (melange + apko + grype)
        env:
          # Authenticates GitHub API calls in internal/toolchain so the
          # 60/hour unauthenticated rate limit isn't shared across every
          # matrix job hitting api.github.com at once (that's what was
          # producing the 401s).
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./bin/nimbopacks toolchain install
      - name: Verify sample
        env:
          SAMPLE: ${{ matrix.sample }}
        run: ./samples/verify-builds.sh "$SAMPLE"
