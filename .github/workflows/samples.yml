name: Samples

on:
  pull_request:
    paths:
      - 'samples/**'
      - 'pkg/packs/**'
      - 'pkg/templates/**'
      - 'pkg/backend/**'
      - 'internal/**'
      - 'cmd/**'
      - '.github/workflows/samples.yml'
  workflow_dispatch:
  schedule:
    - cron: '0 6 * * 1' # Mondays 06:00 UTC

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  changes:
    name: Determine affected samples
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.compute.outputs.matrix }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0
      - name: Compute affected samples
        id: compute
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            matrix="$(git diff --name-only "$BASE_SHA" "$HEAD_SHA" | ./samples/affected-samples.sh)"
          else
            # workflow_dispatch / schedule: always verify everything, to
            # catch drift in the rolling Wolfi package set.
            matrix="$(./samples/affected-samples.sh </dev/null)"
          fi
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"
          echo "Affected samples: $matrix"

  verify:
    name: ${{ matrix.sample }}
    needs: changes
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        sample: ${{ fromJSON(needs.changes.outputs.matrix) }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: '1.26.11'
          cache: true
      - name: Enable rootless melange (bubblewrap)
        run: |
          sudo apt-get update
          sudo apt-get install -y bubblewrap
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - name: Build nimbopacks
        run: go build -o bin/nimbopacks ./cmd/nimbopacks
      - name: Install toolchain (melange + apko + grype)
        env:
          # Authenticates GitHub API calls in internal/toolchain so the
          # 60/hour unauthenticated rate limit isn't shared across every
          # matrix job hitting api.github.com at once (that's what was
          # producing the 401s).
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Pinned to the same melange/apko versions the release job builds
          # and signs with (release.yml's MELANGE_VERSION/APKO_VERSION), by
          # digest, so an upstream release can't turn this matrix red with no
          # commit from us. grype is pinned too for the same reason, even
          # though this job only builds (never scans): an unpinned download
          # anywhere in CI is the same defect as an unpinned action. Digests
          # verified against the published linux_amd64 release assets.
          MELANGE_VERSION: v0.64.1
          MELANGE_SHA256: 0581280c7a3b0137d37ebc9fd20768da76c5201f991a21717b7d4972100ab149
          APKO_VERSION: v1.5.0
          APKO_SHA256: 611cd21aad41dbef2a2698087ebfbb308ba6b0f171797e5571033fb6622ba708
          GRYPE_VERSION: v0.122.0
          GRYPE_SHA256: e697e6f7224637df87e267e4318cc027feae99a8e1b80280241d32b9ee5d4920
        run: |
          ./bin/nimbopacks toolchain install \
            --melange-version "$MELANGE_VERSION" --melange-sha256 "$MELANGE_SHA256" \
            --apko-version "$APKO_VERSION" --apko-sha256 "$APKO_SHA256" \
            --grype-version "$GRYPE_VERSION" --grype-sha256 "$GRYPE_SHA256"
      - name: Verify sample
        env:
          SAMPLE: ${{ matrix.sample }}
        run: ./samples/verify-builds.sh "$SAMPLE"
