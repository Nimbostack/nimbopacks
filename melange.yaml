package:
  name: nimbopacks
  version: 0.0.1
  epoch: 0
  description: Minimal, reproducible OCI container images from source — with atomic CVE patching
  copyright:
    - license: Apache-2.0

environment:
  contents:
    repositories:
      - https://packages.wolfi.dev/os
    keyring:
      - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    packages:
      - ca-certificates-bundle
      - go
      - build-base
      - git
  environment:
    CGO_ENABLED: "0"
    GOFLAGS: "-trimpath"

pipeline:
  - uses: go/build
    with:
      packages: ./cmd/nimbopacks
      output: nimbopacks
      ldflags: -s -w -X main.version=${{package.version}}
