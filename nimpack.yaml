schema_version: "1"

project:
  name: nimbopacks
  version: 0.1.0

build:
  pack: golang
  template: go
  env:
    CGO_ENABLED: "0"
    GOFLAGS: "-trimpath"

image:
  entrypoint: /usr/bin/nimbopacks
  packages:
    - ca-certificates-bundle
    - melange~0.48.2-r1
    - apko~1.2.2-r1
    - bash~5.3-r12
    - grype~0.111.0-r2
  env:
    # Add your runtime env vars here
    # APP_ENV: production
  run_as: 65532
  layering:
    strategy: origin
    budget: 10

update:
  auto_check: true