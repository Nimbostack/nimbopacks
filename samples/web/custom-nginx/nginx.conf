# Custom nginx config shipped by the project. nimbopacks copies it verbatim to
# /etc/nginx/nimbopacks.conf and runs `nginx -c` against it.
#
# It must be non-root-safe, since the image runs as uid 65532:
#   - listen on an unprivileged port (8080, not 80)
#   - no `user` directive (we are already non-root)
#   - pid + temp paths under a writable dir (/var/cache/nginx), not /var/run
#   - logs to stdout/stderr
#   - reuse the nginx package's /etc/nginx/mime.types
worker_processes auto;
daemon off;
pid /var/cache/nginx/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    access_log /dev/stdout;

    # nginx's compiled-in temp paths live under root-owned /var/lib/nginx;
    # point them at the writable cache dir so uid 65532 can create them.
    client_body_temp_path /var/cache/nginx/client_body;
    proxy_temp_path /var/cache/nginx/proxy;
    fastcgi_temp_path /var/cache/nginx/fastcgi;
    uwsgi_temp_path /var/cache/nginx/uwsgi;
    scgi_temp_path /var/cache/nginx/scgi;

    sendfile on;
    keepalive_timeout 65;

    server {
        listen 8080;
        server_name _;
        root /var/www/html;
        index index.html;

        # A distinctive header proves this custom config is in effect (the
        # generated default config does not set it).
        add_header X-Served-By "nimbopacks-custom-nginx" always;

        location / {
            try_files $uri $uri/ =404;
        }

        location = /healthz {
            add_header Content-Type text/plain;
            return 200 "ok\n";
        }

        # An endpoint only this custom config defines.
        location = /custom {
            add_header Content-Type text/plain;
            return 200 "served by a custom nginx.conf\n";
        }
    }
}
