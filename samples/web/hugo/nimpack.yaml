schema_version: "1"

project:
  name: web-hugo-sample
  version: 0.0.1

build:
  pack: web
  template: web-hugo
  command: "hugo --minify"
  dependencies:
    - hugo
    - build-base
  env:
    OUTPUT_DIR: public

image:
  entrypoint: /usr/sbin/nginx
  cmd: ["-e", "/dev/stderr", "-c", "/etc/nginx/nimbopacks.conf"]
  packages:
    - nginx
    - ca-certificates-bundle
  run_as: 65532
  ports:
    - "8080"

update:
  auto_check: true
