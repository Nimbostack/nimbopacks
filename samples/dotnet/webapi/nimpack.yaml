schema_version: "1"

project:
  name: dotnet-webapi-sample
  version: 0.0.1

build:
  pack: dotnet
  template: dotnet-webapi
  command: "dotnet publish -c Release -o /home/build/output/app --no-self-contained"
  dependencies:
    - dotnet-8-sdk
    - build-base

image:
  entrypoint: dotnet
  cmd: ["/app/dotnet-webapi-sample.dll"]
  packages:
    - dotnet-8-runtime
    - aspnet-8-runtime
    - ca-certificates-bundle
    - icu-libs
  env:
    DOTNET_SYSTEM_GLOBALIZATION_INVARIANT: "false"
    ASPNETCORE_URLS: "http://+:8080"
  run_as: 65532
  ports:
    - "8080"

update:
  auto_check: true
