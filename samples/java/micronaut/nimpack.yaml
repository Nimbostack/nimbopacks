schema_version: "1"

project:
  name: java-micronaut-sample
  version: 0.0.1

build:
  pack: java
  template: java-micronaut
  command: "mvn package -DskipTests"
  dependencies:
    - openjdk-21
    - maven
    - build-base
  env:
    JAR_DIR: target

image:
  entrypoint: /usr/lib/jvm/java-21-openjdk/bin/java
  # The Micronaut Maven plugin shades a single executable jar at
  # target/<finalName>.jar; finalName=app makes it target/app.jar.
  cmd: ["-jar", "/app/app.jar"]
  packages:
    - openjdk-21-jre
    - ca-certificates-bundle
  env:
    JAVA_HOME: /usr/lib/jvm/java-21-openjdk
    JAVA_OPTS: "-XX:+UseContainerSupport -XX:MaxRAMPercentage=75.0"
  run_as: 65532
  ports:
    - "8080"

update:
  auto_check: true
