quarkus.http.port=8080
quarkus.http.host=0.0.0.0

# Build a single runnable uber-jar so the nimbopacks java pack can copy one
# self-contained jar into the image. With output-name=app, the uber-jar is
# emitted as target/app-runner.jar (the thin target/app.jar is NOT runnable),
# so the image cmd must point at /app/app-runner.jar.
quarkus.package.jar.type=uber-jar
quarkus.package.output-name=app
