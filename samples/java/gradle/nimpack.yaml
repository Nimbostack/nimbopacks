schema_version: "1"

project:
  name: java-gradle-sample
  version: 0.0.1

build:
  pack: java
  template: java-gradle
  command: "gradle bootJar --no-daemon -x test"
  env:
    # Gradle writes the built jar to build/libs (Maven uses target/).
    JAR_DIR: build/libs
  dependencies:
    - openjdk-21
    - gradle
    - build-base

image:
  entrypoint: /usr/lib/jvm/java-21-openjdk/bin/java
  cmd: ["-jar", "/app/app.jar"]
  packages:
    - openjdk-21-jre
    - ca-certificates-bundle
  env:
    JAVA_HOME: /usr/lib/jvm/java-21-openjdk
    JAVA_OPTS: "-XX:+UseContainerSupport -XX:MaxRAMPercentage=75.0"
  run_as: 65532
  ports:
    - "8080"

update:
  auto_check: true
